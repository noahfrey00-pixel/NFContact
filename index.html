<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noah Frey — Contact</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: #F3F4F1;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }
  a { color: inherit; text-decoration: none; }
  .wrap { width: 100%; max-width: 390px; display: flex; flex-direction: column; gap: 16px; }

  .card {
    background: #14171C;
    border-radius: 24px;
    padding: 36px 28px 32px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 40px -12px rgba(20,23,28,0.35);
  }
  .avatar {
    width: 52px; height: 52px; border-radius: 14px;
    background: #D9B26A;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700; color: #14171C;
    margin-bottom: 20px;
  }
  .name { font-size: 26px; font-weight: 700; color: #FAFAF8; letter-spacing: -0.01em; }
  .role { font-size: 15px; font-weight: 500; color: #D9B26A; margin-top: 2px; }
  .org { font-size: 14px; color: #9CA3AF; margin-top: 10px; line-height: 1.5; }

  .save-btn {
    width: 100%;
    background: #D9B26A;
    color: #14171C;
    border: none;
    border-radius: 14px;
    padding: 16px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-family: inherit;
  }
  .save-btn:hover { background: #E0BC7C; }

  .rows { background: #FFFFFF; border-radius: 18px; padding: 6px; display: flex; flex-direction: column; }
  .row {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 12px; border-radius: 12px;
  }
  .row:hover { background: #F8F8F6; }
  .icon-box {
    width: 40px; height: 40px; border-radius: 10px;
    background: #F3F4F1;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .row-label { font-size: 12px; color: #9CA3AF; font-weight: 500; }
  .row-value { font-size: 15px; color: #14171C; font-weight: 500; }
  .divider { height: 1px; background: #F0F0EE; margin: 0 12px; }

  .footer { text-align: center; font-size: 12px; color: #9CA3AF; padding-top: 4px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="card">
    <div class="avatar">NF</div>
    <div class="name">Noah Frey</div>
    <div class="role">Corporate Finance Analyst</div>
    <div class="org">Emerald Technology Ventures<br>Zurich, Switzerland</div>
  </div>

  <button class="save-btn" onclick="saveContact()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#14171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><path d="M20 8v6M23 11h-6"></path></svg>
    Save to Contacts
  </button>

  <div class="rows">

    <a class="row" href="mailto:Noah.frey@emerald.vc">
      <div class="icon-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#14171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 6c0-1.1-.9-2-2-2H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6Z"></path><path d="m22 6-10 7L2 6"></path></svg>
      </div>
      <div>
        <div class="row-label">Email</div>
        <div class="row-value">Noah.frey@emerald.vc</div>
      </div>
    </a>

    <div class="divider"></div>

    <a class="row" href="tel:+41772116650">
      <div class="icon-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#14171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
      </div>
      <div>
        <div class="row-label">Phone</div>
        <div class="row-value">+41 77 211 66 50</div>
      </div>
    </a>

    <div class="divider"></div>

    <a class="row" href="https://www.linkedin.com/in/noah-frey" target="_blank" rel="noopener">
      <div class="icon-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#14171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path><rect x="2" y="9" width="4" height="12"></rect><circle cx="4" cy="4" r="2"></circle></svg>
      </div>
      <div>
        <div class="row-label">LinkedIn</div>
        <div class="row-value">linkedin.com/in/noah-frey</div>
      </div>
    </a>

  </div>

  <div class="footer">Tap a row to email, call, or connect</div>

</div>

<script>
function saveContact() {
  var lines = [
    'BEGIN:VCARD',
    'VERSION:3.0',
    'FN:Noah Frey',
    'N:Frey;Noah;;;',
    'ORG:Emerald Technology Ventures',
    'TITLE:Corporate Finance Analyst',
    'TEL;TYPE=WORK,VOICE:+41772116650',
    'EMAIL;TYPE=WORK:Noah.frey@emerald.vc',
    'URL:https://www.linkedin.com/in/noah-frey',
    'ADR;TYPE=WORK:;;;Zurich;;;Switzerland',
    'END:VCARD'
  ];
  var vcf = lines.join('\r\n');
  var blob = new Blob([vcf], { type: 'text/vcard;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var link = document.createElement('a');
  link.href = url;
  link.download = 'Noah-Frey.vcf';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
}
</script>
</body>
</html>
